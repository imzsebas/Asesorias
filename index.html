<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renombrador de Asesorías</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-group">
      <h1>Renombrador de Asesorías</h1>
    </div>
  </header>

  <div class="table-scroll">
    <table class="rows">
      <thead>
        <tr>
          <th class="col-num">Número de asesoría</th>
          <th>ASESORÍA No.</th>
          <th>ANEXOS ASESORÍA No.</th>
          <th>FORMATO ARCHIVO ASESORIA No.</th>
          <th class="col-select">Área del derecho</th>
          <th class="col-select">Semestre</th>
          <th class="col-estado">Estado</th>
          <th class="col-rm"></th>
        </tr>
      </thead>
      <tbody id="rowsBody"></tbody>
    </table>
  </div>

  <div class="toolbar">
    <button class="ghost" id="addRowBtn">+ Agregar fila</button>
    <span></span>
  </div>

  <div class="action-row">
    <span class="msg" id="actionMsg"></span>
    <button id="downloadBtn" disabled>Descargar ZIP</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
