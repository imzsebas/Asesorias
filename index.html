<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesorías</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2334d399'/%3E%3Cpath d='M20 18h18l8 8v20a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2Z' fill='%2304130d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-group">
      <span class="eyebrow">Gestión documental</span>
      <h1>Asesorías</h1>
      <p class="lead">Carga los archivos de cada asesoría, revisa el número detectado y descarga todo organizado en un ZIP.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="themeToggleLabel">Modo claro</span>
    </button>
  </header>

  <div class="table-scroll">
    <table class="rows">
      <thead>
        <tr>
          <th class="col-num">Número de asesoría</th>
          <th>ASESORIA</th>
          <th>ANEXOS</th>
          <th>FORMATO</th>
          <th class="col-select">Área del derecho</th>
          <th class="col-select">Semestre</th>
          <th class="col-rm"></th>
        </tr>
      </thead>
      <tbody id="rowsBody"></tbody>
    </table>
  </div>

  <div class="toolbar">
    <button class="ghost" id="addRowBtn">+ Agregar</button>
    <span></span>
  </div>

  <div class="action-row">
    <span class="msg" id="actionMsg"></span>
    <button id="downloadBtn" disabled>Descargar</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
